plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)

}

android {
    namespace = 'com.wkq.util'
    compileSdk appConfig.compileSdk

    defaultConfig {
        minSdk appConfig.minSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = appConfig.jvmTarget
        // Luban 2.0.1 is compiled with Kotlin 2.3 metadata; suppressing the check
        // to allow our Kotlin 2.1.x compiler to work with it.
        freeCompilerArgs.addAll(["-Xskip-metadata-version-check"])
    }
}

dependencies {
    implementation( libs.androidx.appcompat)
    // toast
    api libs.toasty
    //sp存储
    api libs.mmkv
    // 图片加载库
    api libs.coil
    api libs.coil3.coil.gif
    // 如果需要 OkHttp 网络支持：
    implementation (libs.coil.network.okhttp)
    // 图片压缩库
    implementation(libs.luban)


    // 工具类库
    api(libs.blankj.utilcode) {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
    }


}
